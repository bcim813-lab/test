<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBS HRMS — Complete HR Management System</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{
  --primary:#2563eb;--primary-h:#1d4ed8;--primary-lt:#eff6ff;
  --success:#16a34a;--success-lt:#f0fdf4;
  --danger:#dc2626;--danger-lt:#fef2f2;
  --warning:#d97706;--warning-lt:#fffbeb;
  --purple:#7c3aed;--purple-lt:#f5f3ff;
  --teal:#0d9488;--teal-lt:#f0fdfa;
  --pink:#db2777;--pink-lt:#fdf2f8;
  --sidebar:#17243a;--sidebar-sub:#111c2f;--sidebar-hover:#253650;
  --bg:#f3f6fb;--white:#fff;
  --text:#1e293b;--muted:#64748b;--border:#e2e8f0;
  --radius:10px;--shadow:0 2px 12px rgba(15,23,42,.07);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
body{background:var(--bg);color:var(--text);display:flex;min-height:100vh;overflow-x:hidden;}

/* ── SIDEBAR ── */
.sidebar{width:260px;background:var(--sidebar);color:#9bb0cc;display:flex;flex-direction:column;position:fixed;height:100vh;overflow-y:auto;z-index:100;box-shadow:4px 0 18px rgba(15,23,42,.12);}
.logo-area{padding:18px 20px;font-size:17px;font-weight:800;color:#fff;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08);min-height:66px;}
.logo-area i{color:#60a5fa;font-size:20px;}
.logo-badge{font-size:9px;background:#3b82f6;color:#fff;padding:2px 6px;border-radius:10px;font-weight:700;letter-spacing:.04em;}
.menu-label{padding:10px 20px 4px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4a6080;}
.menu-list{list-style:none;padding-bottom:24px;}
.menu-item{padding:11px 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:13px;font-weight:500;transition:.15s;border-left:3px solid transparent;}
.menu-item:hover{background:var(--sidebar-hover);color:#fff;}
.menu-item.active{background:var(--sidebar-hover);color:#fff;border-left-color:var(--primary);}
.menu-item-left{display:flex;align-items:center;gap:11px;}
.menu-item-left i{font-size:15px;width:18px;text-align:center;}
.sub-menu{list-style:none;background:var(--sidebar-sub);display:none;}
.sub-menu.open{display:block;}
.sub-menu li{padding:10px 20px 10px 50px;font-size:12px;cursor:pointer;color:#8aaccc;transition:.15s;display:flex;align-items:center;gap:8px;}
.sub-menu li:hover{color:#fff;background:rgba(255,255,255,.04);}
.sub-menu li.active-sub{color:#60a5fa;background:rgba(59,130,246,.12);font-weight:600;}

/* ── MAIN ── */
.main-wrapper{margin-left:260px;width:calc(100% - 260px);display:flex;flex-direction:column;}
.topbar{background:#fff;height:64px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;box-shadow:0 1px 6px rgba(15,23,42,.05);}
.topbar-title{font-weight:700;font-size:15px;color:#0f172a;}
.topbar-right{display:flex;align-items:center;gap:16px;font-size:13px;}
.topbar-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;border:1px solid var(--border);background:#fff;color:var(--text);cursor:pointer;font-size:12px;font-weight:500;transition:.15s;}
.topbar-btn:hover{border-color:#93c5fd;background:var(--primary-lt);color:var(--primary);}
.topbar-avatar{width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer;}
.topbar-date{color:var(--muted);font-size:12px;}
.notif-dot{position:relative;}.notif-dot::after{content:'';position:absolute;top:1px;right:1px;width:7px;height:7px;border-radius:50%;background:#ef4444;border:2px solid #fff;}

/* ── PAGE ── */
.page-content{padding:28px;display:none;animation:fadeIn .25s;}
.page-content.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ── CARDS ── */
.card{background:#fff;border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);margin-bottom:20px;}
.card-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:10px;}
.card-title{font-size:15px;font-weight:700;color:#0f172a;display:flex;align-items:center;gap:8px;}
.card-title i{color:var(--primary);}
.card-body{padding:20px;}
.card-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;background:#fafbfc;border-radius:0 0 var(--radius) var(--radius);}

/* ── KPI CARDS ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:22px;}
.kpi-card{background:#fff;border-radius:var(--radius);border:1px solid var(--border);border-top:3px solid var(--primary);padding:16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);}
.kpi-icon{width:44px;height:44px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
.kpi-body{min-width:0;}
.kpi-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:block;}
.kpi-value{font-size:26px;font-weight:800;color:#0f172a;line-height:1.1;display:block;}
.kpi-sub{font-size:11px;color:#94a3b8;display:block;margin-top:2px;}
.kpi-trend-up{color:var(--success);font-size:11px;font-weight:600;}
.kpi-trend-dn{color:var(--danger);font-size:11px;font-weight:600;}

/* ── FORMS ── */
.form-section{margin-bottom:24px;}
.form-section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--primary);margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--primary-lt);display:flex;align-items:center;gap:7px;}
.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px 28px;}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px 20px;}
.form-grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 16px;}
.form-group{display:flex;flex-direction:column;gap:5px;}
.form-label{font-size:12px;font-weight:600;color:#334155;}
.form-label .req{color:var(--danger);}
.form-control{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:7px;font-size:13px;color:var(--text);background:#fff;transition:.15s;min-height:38px;}
.form-control:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.1);}
.form-control::placeholder{color:#b0bec9;}
select.form-control{cursor:pointer;}
textarea.form-control{min-height:80px;resize:vertical;}
.form-hint{font-size:11px;color:var(--muted);margin-top:2px;}
.form-actions{display:flex;gap:10px;padding-top:18px;border-top:1px solid var(--border);margin-top:4px;flex-wrap:wrap;}
.radio-row{display:flex;gap:20px;margin-top:4px;}
.radio-row label{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 18px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:.15s;white-space:nowrap;}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary);}
.btn-primary:hover{background:var(--primary-h);}
.btn-success{background:var(--success);color:#fff;border-color:var(--success);}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger);}
.btn-warning{background:var(--warning);color:#fff;border-color:var(--warning);}
.btn-purple{background:var(--purple);color:#fff;border-color:var(--purple);}
.btn-secondary{background:#fff;color:var(--text);border-color:var(--border);}
.btn-secondary:hover{background:#f1f5f9;border-color:#cbd5e1;}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:6px;}
.btn-xs{padding:3px 9px;font-size:11px;border-radius:5px;}
.btn-icon{width:34px;height:34px;padding:0;justify-content:center;border-radius:7px;}

/* ── TABLES ── */
.tbl-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{background:#f7f9fc;color:#334155;padding:11px 14px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);white-space:nowrap;}
.tbl td{padding:11px 14px;border-bottom:1px solid #f1f5f9;color:var(--text);vertical-align:middle;}
.tbl tr:last-child td{border-bottom:0;}
.tbl tbody tr:hover td{background:#f8fbff;}
.tbl-empty{text-align:center;color:var(--muted);padding:32px!important;font-size:13px;}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;}
.badge-success{background:#dcfce7;color:#166534;}
.badge-danger{background:#fee2e2;color:#991b1b;}
.badge-warning{background:#fef3c7;color:#92400e;}
.badge-info{background:#dbeafe;color:#1e40af;}
.badge-purple{background:#ede9fe;color:#5b21b6;}
.badge-gray{background:#f1f5f9;color:#475569;}
.badge-pink{background:#fce7f3;color:#9d174d;}
.badge-teal{background:#ccfbf1;color:#134e4a;}

/* ── TOOLBAR ── */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.toolbar-search{position:relative;flex:1;min-width:200px;max-width:320px;}
.toolbar-search input{width:100%;padding:8px 12px 8px 36px;border:1px solid var(--border);border-radius:7px;font-size:13px;}
.toolbar-search input:focus{outline:none;border-color:var(--primary);}
.toolbar-search i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;}
.toolbar-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.record-count{font-size:12px;color:var(--muted);}

/* ── SECTION HEADING ── */
.section-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
.section-heading h2{font-size:20px;font-weight:700;color:#0f172a;}
.section-heading p{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.5;}

/* ── STATS ROW ── */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px;}
.stat-box{background:#fff;border:1px solid var(--border);border-radius:9px;padding:14px 16px;box-shadow:0 1px 4px rgba(15,23,42,.04);}
.stat-box span{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;}
.stat-box strong{display:block;font-size:22px;font-weight:800;color:#0f172a;margin-top:4px;}
.stat-box small{display:block;font-size:11px;color:var(--muted);margin-top:2px;}

/* ── CHART CARD ── */
.chart-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
.chart-header{display:flex;align-items:center;gap:9px;padding:14px 18px;border-bottom:1px solid var(--border);font-size:13px;font-weight:700;color:#334155;}
.chart-header i{color:var(--primary);}
.chart-body{padding:16px;}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px;}
.modal-overlay.open{display:flex;}
.modal{background:#fff;border-radius:12px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(15,23,42,.18);}
.modal-lg{max-width:780px;}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border);}
.modal-header h3{font-size:16px;font-weight:700;}
.modal-close{width:30px;height:30px;border:0;background:0;cursor:pointer;color:var(--muted);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.modal-close:hover{background:#f1f5f9;}
.modal-body{padding:22px;}
.modal-footer{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}

/* ── TABS ── */
.tab-bar{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:20px;}
.tab-btn{padding:10px 18px;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:.15s;white-space:nowrap;}
.tab-btn:hover{color:var(--primary);}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:700;}
.tab-pane{display:none;}
.tab-pane.active{display:block;animation:fadeIn .2s;}

/* ── STEPS / TIMELINE ── */
.steps{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin:16px 0;}
.step{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 16px;border:1px solid var(--border);border-radius:9px;background:#f8fafc;min-width:110px;text-align:center;position:relative;}
.step.done{background:#f0fdf4;border-color:#bbf7d0;}
.step.current{background:var(--primary-lt);border-color:#bfdbfe;}
.step.pending{opacity:.6;}
.step-icon{font-size:20px;color:var(--primary);}
.step.done .step-icon{color:var(--success);}
.step.pending .step-icon{color:#94a3b8;}
.step-label{font-size:11px;font-weight:700;color:#334155;}
.step-status{font-size:10px;color:var(--muted);}
.step.done .step-status{color:var(--success);font-weight:700;}
.step.current .step-status{color:var(--primary);font-weight:700;}
.step-arrow{font-size:18px;color:#cbd5e1;padding:0 2px;}

/* ── PROFILE CARD ── */
.emp-profile{display:flex;align-items:center;gap:14px;padding:16px;background:var(--primary-lt);border-radius:9px;margin-bottom:16px;}
.emp-avatar{width:52px;height:52px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0;}
.emp-name{font-size:15px;font-weight:700;color:#0f172a;}
.emp-meta{font-size:12px;color:var(--muted);margin-top:2px;}

/* ── ATTENDANCE TIMER ── */
.att-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:20px;}
.att-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:linear-gradient(135deg,#1e3a5f,#2563eb);color:#fff;}
.att-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;}
.att-body{padding:28px 20px;text-align:center;}
.att-status{font-size:20px;color:#334155;font-weight:500;margin-bottom:10px;}
.att-timer{font-size:46px;font-weight:800;color:var(--primary);letter-spacing:3px;margin:10px 0 20px;font-variant-numeric:tabular-nums;}
.att-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;}
.att-btn{min-width:140px;height:50px;border-radius:9px;border:none;font-size:14px;font-weight:700;cursor:pointer;color:#fff;transition:.15s;}
.att-btn:hover{transform:translateY(-1px);opacity:.93;}
.att-btn.checkin{background:linear-gradient(135deg,#2563eb,#1d4ed8);}
.att-btn.checkout{background:linear-gradient(135deg,#2563eb,#1d4ed8);}
.att-btn.lunch{background:#d97706;}
.att-btn.tea{background:#3b82f6;}
.att-btn.endbreak{background:#dc2626;}
.att-btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}

/* ── PAYROLL SLIP ── */
.slip-preview{border:1px solid #d1d5db;border-radius:8px;overflow:hidden;font-size:12px;background:#fff;}
.slip-head{background:linear-gradient(135deg,#1e3a5f,#2563eb);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:flex-start;}
.slip-company{font-size:16px;font-weight:800;}
.slip-period{font-size:11px;text-align:right;}
.slip-emp{padding:12px 20px;background:#f8fafc;border-bottom:1px solid #e5e7eb;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.slip-field{display:flex;flex-direction:column;gap:1px;}
.slip-field span{font-size:10px;color:var(--muted);font-weight:600;}
.slip-field strong{font-size:12px;color:#0f172a;}
.slip-cols{display:grid;grid-template-columns:1fr 1fr;gap:0;}
.slip-col{padding:12px 20px;}
.slip-col-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#334155;margin-bottom:8px;padding-bottom:5px;border-bottom:2px solid #e5e7eb;}
.slip-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dotted #f1f5f9;font-size:12px;}
.slip-total{display:flex;justify-content:space-between;padding:8px 20px;background:#f0f9ff;border-top:2px solid #bfdbfe;font-weight:800;font-size:13px;}
.slip-net{background:linear-gradient(135deg,#1e3a5f,#2563eb);color:#fff;padding:10px 20px;display:flex;justify-content:space-between;font-weight:800;font-size:14px;}

/* ── UTILITY ── */
.text-muted{color:var(--muted);}
.text-primary{color:var(--primary);}
.text-success{color:var(--success);}
.text-danger{color:var(--danger);}
.text-warning{color:var(--warning);}
.text-center{text-align:center;}
.text-right{text-align:right;}
.fw-bold{font-weight:700;}
.mt-0{margin-top:0!important;}
.mb-0{margin-bottom:0!important;}
.gap-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.gap-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;}
.gap-grid-auto{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;}
.flex-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.spacer{flex:1;}
.divider{height:1px;background:var(--border);margin:16px 0;}
.notice{padding:12px 16px;border-radius:8px;font-size:12px;line-height:1.6;border:1px solid;}
.notice-info{background:#f0f9ff;border-color:#bae6fd;color:#0c4a6e;}
.notice-warn{background:#fefce8;border-color:#fde047;color:#713f12;}
.notice-danger{background:#fff1f2;border-color:#fecdd3;color:#881337;}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border:1px solid var(--border);border-radius:16px;font-size:12px;font-weight:500;cursor:pointer;background:#fff;transition:.12s;}
.chip:hover,.chip.selected{border-color:var(--primary);color:var(--primary);background:var(--primary-lt);}
.chip.selected::before{content:"\f00c";font-family:"Font Awesome 6 Free";font-weight:900;font-size:10px;}
.chips-wrap{display:flex;flex-wrap:wrap;gap:7px;margin-top:5px;}

/* ── DASHBOARD SPECIFIC ── */
.dash-welcome{background:linear-gradient(135deg,#1e3a5f 0%,#2563eb 100%);border-radius:12px;padding:22px 26px;color:#fff;margin-bottom:22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;}
.dash-welcome h1{font-size:22px;font-weight:800;margin-bottom:4px;}
.dash-welcome p{font-size:13px;color:rgba(255,255,255,.75);}
.dash-welcome-actions{display:flex;gap:8px;flex-wrap:wrap;}
.dash-welcome-btn{padding:8px 16px;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;}
.dash-welcome-btn:hover{background:rgba(255,255,255,.22);}

/* ── APPROVAL STEPS ── */
.approval-trail{padding:16px;background:#f8fafc;border-radius:8px;border:1px solid var(--border);}
.approval-step{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #f1f5f9;}
.approval-step:last-child{border-bottom:0;}
.approval-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}
.approval-dot.done{background:#dcfce7;color:#166534;}
.approval-dot.current{background:#dbeafe;color:#1e40af;}
.approval-dot.pending{background:#f1f5f9;color:#94a3b8;}
.approval-info strong{display:block;font-size:13px;color:#0f172a;}
.approval-info span{font-size:12px;color:var(--muted);}

/* ── PRINT ── */
@media print{
  .sidebar,.topbar,.no-print{display:none!important;}
  .main-wrapper{margin:0;width:100%;}
  .page-content.active{padding:0;}
}

/* ── RESPONSIVE ── */
@media(max-width:900px){
  .sidebar{width:220px;}
  .main-wrapper{margin-left:220px;width:calc(100% - 220px);}
  .form-grid-2,.form-grid-3,.form-grid-4{grid-template-columns:1fr;}
  .gap-grid-2,.gap-grid-3{grid-template-columns:1fr;}
}
@media(max-width:640px){
